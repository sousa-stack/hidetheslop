name: Deploy

on:
  push:
    branches: [main]
    paths:
      - api/**
      - docker-compose.yml
      - Caddyfile
      - deploy.sh
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hidetheslop_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/hidetheslop_test
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/hidetheslop_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm run build
      - run: npm run migrate
      - run: npm test

  deploy:
    needs: test
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    # The deploy secrets live in this environment, which only main can use.
    environment: production
    runs-on: ubuntu-latest
    steps:
      # ssh-action skips host key checking when the fingerprint is empty.
      - name: Require the host key fingerprint
        env:
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          if [ -z "$DEPLOY_HOST_FINGERPRINT" ]; then
            echo "::error::Set the DEPLOY_HOST_FINGERPRINT secret. Without it, host key checking is skipped."
            exit 1
          fi
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          # Ignored: the droplet's authorized_keys forces this key to run deploy.sh and
          # nothing else. ssh-action still wants a script, so it says what runs.
          script: ~/hidetheslop/deploy.sh main
