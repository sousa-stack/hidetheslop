name: Release

# Pushing a tag like v1.12.0 tests and builds the extension, makes a GitHub Release with
# both zips, and, once the STORE_PUBLISH_ENABLED variable is "true", sends the zips to
# the Chrome Web Store and addons.mozilla.org. Until then a tag stops at the Release.
#
# Run by hand it's a dry run: it tests, builds and keeps the zips with the run, and
# publishes nothing. From a tag it can also check the store credentials without
# uploading, or do the store uploads a tag push skipped.
# Kevin's steps are in docs/store/browser-stores.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      stores:
        description: 'Stores. "check" and "publish" only work when run from a version tag'
        type: choice
        default: none
        options:
          - none
          - check
          - publish

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CHROME_ITEM_ID: ijoplnhgjdnkohkifananhbeonndcnll
  AMO_ADDON_ID: hidetheslop@hidetheslop.com

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      stores: ${{ steps.plan.outputs.stores }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, to see whether the tag is on main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Decide what this run does
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ASKED: ${{ inputs.stores }}
          STORE_PUBLISH_ENABLED: ${{ vars.STORE_PUBLISH_ENABLED }}
        run: |
          version=$(sed -n "s/^const version = '\(.*\)';$/\1/p" extension/build.mjs)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Couldn't read the version from extension/build.mjs."
            exit 1
          fi
          release=false
          stores=none
          if [ "$EVENT" = push ]; then
            release=true
            if [ "$STORE_PUBLISH_ENABLED" = true ]; then stores=publish; fi
          else
            stores=${ASKED:-none}
            if [ "$stores" = publish ]; then release=true; fi
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag is $GITHUB_REF_NAME, but extension/build.mjs says $version. The tag has to be v$version."
              exit 1
            fi
            # Anyone who can push a tag could point one at a commit that was never on main.
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
              echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main."
              exit 1
            fi
          elif [ "$stores" != none ]; then
            echo "::error::Checking or publishing to the stores only runs from a version tag. Pick the tag under \"Use workflow from\"."
            exit 1
          fi
          {
            echo "version=$version"
            echo "release=$release"
            echo "stores=$stores"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version. GitHub Release: $release. Stores: $stores." >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        working-directory: extension
        run: |
          node --test test/votes.test.mjs test/crowd.test.mjs
          node --test test/meta.test.mjs test/download.test.mjs test/phash.test.mjs
          node --test test/release.test.mjs
      - name: Build
        working-directory: extension
        run: node build.mjs
      - name: Check the zips and write the release notes
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          mkdir out
          for browser in chrome firefox; do
            zip="extension/dist/hidetheslop-$browser-$VERSION.zip"
            # The stores read the version from the manifest inside the zip, so check that one.
            inside=$(unzip -p "$zip" manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
            if [ "$inside" != "$VERSION" ]; then
              echo "::error::$zip holds version $inside, not $VERSION."
              exit 1
            fi
            cp "$zip" out/
          done
          # This version's part of the changelog, up to the next "## " heading.
          awk -v want="## $VERSION" '$0 == want { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > out/release-notes.md
          if ! grep -q '[^[:space:]]' out/release-notes.md; then
            echo "::error::CHANGELOG.md has no \"## $VERSION\" section."
            exit 1
          fi
          {
            echo
            echo 'SHA-256:'
            echo '```'
            (cd out && sha256sum ./*.zip | sed 's# \./# #')
            echo '```'
          } >> out/release-notes.md
          cat out/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zips
          path: out/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to make the Release; no other job can write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zips
          path: out
      - name: Make the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # A second run for the same tag replaces the zips instead of failing.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/*.zip --verify-tag --title "Hide the Slop $VERSION" --notes-file out/release-notes.md
          fi

  # The store jobs are separate so that one store failing leaves the other alone, and
  # "Re-run failed jobs" retries only the one that failed.
  chrome:
    needs: [build, release]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && (
        needs.build.outputs.stores == 'check' ||
        (needs.build.outputs.stores == 'publish' && needs.release.result == 'success')) }}
    # The store secrets live in this environment, which only v* tags can use.
    environment: stores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zips
          path: out
      - name: Chrome Web Store
        env:
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          STORES: ${{ needs.build.outputs.stores }}
        run: |
          if [ "$STORES" = publish ]; then
            node extension/tools/publish-chrome.mjs "out/hidetheslop-chrome-$RELEASE_VERSION.zip"
          else
            node extension/tools/publish-chrome.mjs --check
          fi

  firefox:
    needs: [build, release]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && (
        needs.build.outputs.stores == 'check' ||
        (needs.build.outputs.stores == 'publish' && needs.release.result == 'success')) }}
    environment: stores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zips
          path: out
      - name: addons.mozilla.org
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_NOTES_FILE: docs/store/amo-reviewer-notes.txt
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          STORES: ${{ needs.build.outputs.stores }}
        run: |
          if [ "$STORES" = publish ]; then
            node extension/tools/publish-firefox.mjs "out/hidetheslop-firefox-$RELEASE_VERSION.zip"
          else
            node extension/tools/publish-firefox.mjs --check
          fi
