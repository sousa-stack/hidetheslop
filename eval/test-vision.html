<!doctype html>
<!-- Runs the extension's background.js (with vision.js and the real model) in a normal
     page, with the extension APIs stubbed. Checks:
       1. scores match browser-check.json (computed on the Mac with sharp)
       2. rating a picture saves it, retrains, and moves its score
       3. a picture is downloaded once for both checks, and not at all just to read
          metadata on hosts that strip it
       4. the hash a rating queues, through the real background path, matches SlopHash
          run directly on that file
     Serve the "Hide the Slop" folder (python3 -m http.server 8767), open /eval/test-vision.html -->
<meta charset="utf-8">
<title>Vision check</title>
<pre id="out">running…</pre>
<script>
  const SRC = new URL('../extension/src/', location.href).href;
  const local = {};
  const changeListeners = [];
  let onMessage = null;
  const noop = { addListener() {} };
  window.chrome = {
    runtime: {
      getURL: (p) => SRC + p,
      onMessage: { addListener: (fn) => (onMessage = fn) },
      onInstalled: noop,
      onStartup: noop,
      sendMessage: async () => {},
      openOptionsPage() {},
      getManifest: () => ({}),
    },
    storage: {
      local: {
        get: async (k) => (typeof k === 'string' ? { [k]: local[k] } : { ...local }),
        remove: async (keys) => [].concat(keys).forEach((k) => delete local[k]),
        set: async (patch) => {
          Object.assign(local, patch);
          const changes = Object.fromEntries(Object.keys(patch).map((k) => [k, { newValue: patch[k] }]));
          changeListeners.forEach((l) => l(changes, 'local'));
        },
      },
      onChanged: { addListener: (l) => changeListeners.push(l) },
    },
    tabs: { onUpdated: noop, onRemoved: noop, sendMessage: async () => {} },
    action: { setBadgeText: async () => {}, setBadgeBackgroundColor: async () => {} },
    contextMenus: { removeAll: async () => {}, create() {}, onClicked: noop },
    permissions: { contains: async () => true, onRemoved: noop },
    alarms: { get: async () => ({}), create() {}, onAlarm: noop },
  };
  // Count downloads per URL.
  const fetched = {};
  const realFetch = window.fetch;
  window.fetch = (input, init) => {
    const u = String(input && input.url ? input.url : input);
    fetched[u] = (fetched[u] || 0) + 1;
    return realFetch(input, init);
  };
  // What a content script would send.
  const send = (msg) => new Promise((resolve) => onMessage(msg, { tab: { id: 1 }, frameId: 0 }, resolve));
</script>
<script src="../extension/src/common.js"></script>
<script src="../extension/src/meta.js"></script>
<script src="../extension/src/train.js"></script>
<script src="../extension/src/votes.js"></script>
<script src="../extension/src/ort/ort.wasm.min.js"></script>
<script src="../extension/src/phash.js"></script>
<script src="../extension/src/vision.js"></script>
<script src="../extension/src/background.js"></script>
<script>
(async () => {
  const out = document.getElementById('out');
  try {
    // Put the already-downloaded model where vision.js looks, so it doesn't fetch it again.
    const src = /MODEL_URL =\s*'([^']+)'/.exec(await (await fetch(SRC + 'vision.js')).text())[1];
    const cache = await caches.open('hidetheslop-model');
    if (!(await cache.match(src))) {
      const buf = await (await fetch('models/Xenova/clip-vit-base-patch32/onnx/vision_model_int8.onnx')).arrayBuffer();
      await cache.put(src, new Response(buf));
    }

    // 1. Same scores as the Mac.
    const list = await (await fetch('browser-check.json')).json();
    let maxDiff = 0, flips = 0;
    const t0 = performance.now();
    const url = (image) => new URL(image, location.href).href;
    for (const { image, expected } of list) {
      const got = (await send({ type: 'check', url: url(image), picture: true })).score;
      maxDiff = Math.max(maxDiff, Math.abs(got - expected));
      if ((got >= 0.7) !== (expected >= 0.7)) flips++;
    }
    const scores = { n: list.length, maxDiff: +maxDiff.toFixed(4), flips, msPerImage: Math.round((performance.now() - t0) / list.length) };

    // 2. Ratings. Use the AI image the shipped classifier is surest about.
    const top = list.reduce((a, b) => (b.expected > a.expected ? b : a));
    const before = (await send({ type: 'check', url: url(top.image), picture: true })).score;
    const r1 = performance.now();
    const ok1 = await send({ type: 'learn', url: url(top.image), label: 'real' });
    const retrainMs = Math.round(performance.now() - r1);
    const afterReal = (await send({ type: 'check', url: url(top.image), picture: true })).score;
    const counts1 = [local.visionRatings.ai.length, local.visionRatings.real.length];
    const ok2 = await send({ type: 'learn', url: url(top.image), label: 'ai' }); // changed my mind
    const afterAi = (await send({ type: 'check', url: url(top.image), picture: true })).score;
    const counts2 = [local.visionRatings.ai.length, local.visionRatings.real.length];
    const learning = {
      image: top.image.split('/').pop(),
      before: +before.toFixed(3), afterRatedReal: +afterReal.toFixed(3), afterRatedAiInstead: +afterAi.toFixed(3),
      saved: ok1 && ok2, ratingsAfterReal: counts1, ratingsAfterSwitch: counts2, retrainMs,
    };

    // 3. Downloads.
    const sd = new URL('../extension/test/fixtures/sd-burger.png', location.href).href;
    const both = await send({ type: 'check', url: sd, picture: true, meta: true });
    const bothAgain = await send({ type: 'check', url: sd, picture: true, meta: true });
    const real = new URL('../extension/test/fixtures/real-photo.png', location.href).href;
    const metaOnly = await send({ type: 'check', url: real, picture: false, meta: true });
    const stripped = 'https://scontent.xx.fbcdn.net/v/never-fetched.jpg';
    const strippedResult = await send({ type: 'check', url: stripped, picture: false, meta: true });
    const downloads = {
      bothChecksFromOneDownload: fetched[sd],
      metaVerdict: both.meta && both.meta.reason,
      gotScore: typeof both.score === 'number',
      cachedRepeatSame: JSON.stringify(both) === JSON.stringify(bothAgain),
      metaOnlyDownloads: fetched[real],
      metaOnlyAi: metaOnly.meta && metaOnly.meta.ai,
      strippingHostDownloads: fetched[stripped] || 0,
      strippingHostResult: strippedResult,
    };

    // 4. A rating queues the same hash SlopHash gives on the file. Sharing off queues
    // nothing, and a picture with no hash still saves its rating. shapes.png is drawn, so
    // this needs no real picture.
    const shapes = new URL('../extension/test/fixtures/shapes.png', location.href).href;
    const direct = await SlopHash.fromBlob(await (await fetch(shapes)).blob());
    const noHash = await SlopHash.fromBlob(await (await fetch(sd)).blob());
    delete local.voteQueue;
    const offSaved = await send({ type: 'learn', url: shapes, label: 'ai', source: 'rated' });
    const queuedWhileOff = (local.voteQueue || []).length;
    local.shareRatings = true;
    const noHashSaved = await send({ type: 'learn', url: sd, label: 'ai', source: 'hid' });
    const queuedForNoHash = (local.voteQueue || []).length;
    const onSaved = await send({ type: 'learn', url: shapes, label: 'ai', source: 'hid' });
    const [entry] = local.voteQueue || [];
    const hash = {
      direct: direct.phash,
      viaRating: entry && entry.phash,
      match: !!direct.phash && entry?.phash === direct.phash,
      sourceKept: entry?.source === 'hid',
      vectorBytes: entry && atob(entry.vector).length,
      fromSlopVision: (await SlopVision.hash(shapes)) === direct.phash,
      savedWhileOff: offSaved,
      queuedWhileOff,
      fixtureWithNoHash: noHash.why,
      savedWithNoHash: noHashSaved,
      queuedForNoHash,
      savedWhileOn: onSaved,
    };

    window.result = { runtime: ort.env.versions?.web, scores, learning, downloads, hash };
    out.textContent = JSON.stringify(window.result, null, 2);
  } catch (e) {
    window.result = { error: String((e && e.stack) || e) };
    out.textContent = window.result.error;
  }
})();
</script>
