name: hidetheslop

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    # Doesn't wait for the API, so the status page stays up when the API is down.
    logging: *logging
    networks: [web]

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      CONFIRM_MIN_VOTES: ${CONFIRM_MIN_VOTES:-5}
    # No host port. Only Caddy can reach it.
    expose: ["3000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: on Alpine that goes to ::1, and the API listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [web, internal]

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # No ports block on purpose. Postgres is never reachable from the internet.
    volumes:
      # Version 18 images moved their data, so this isn't /var/lib/postgresql/data.
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in .env} -d ${POSTGRES_DB:?set POSTGRES_DB in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    networks: [internal]

  uptime:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    environment:
      # Without this, a new install opens a public page where the first visitor picks the
      # database, before there's an admin to protect it.
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - kuma_data:/app/data
    expose: ["3001"]
    logging: *logging
    networks: [web]

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  kuma_data:

networks:
  web:
  internal:
    internal: true
